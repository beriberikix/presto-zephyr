CONFIG_WIFI_AIROC=y
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# The AIROC/WHD CYW43439 bring-up (firmware download + deep nested calls
# over PIO-SPI) overflows the default 1 KB stacks, corrupting a return
# address -> usage fault (~3 s into boot). 4 KB is enough to init cleanly.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
