# Kitchen-sink demo: all features on the display, touch-swipe navigation.
# Hardware-only options (half-res/double-buffer display, PSRAM, CYW43439) live
# in boards/presto_rp2350b_m33.conf; native_sim overrides are in
# boards/native_sim.conf. No shell — it is dropped to keep SRAM for the second
# framebuffer + the Wi-Fi stack.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Display (resolved through chosen zephyr,display; SDL on native_sim)
CONFIG_DISPLAY=y
CONFIG_GPIO=y

# Capacitive touch (FT6236 over bit-bang I2C)
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_FT6146=y

# 7x SK6812 NeoPixels
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_RPI_PICO_PIO=y

# Networking for the Wi-Fi screen (the CYW43439 driver is enabled per-board)
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
