# Hardware-only options for the Presto board.

# Drive the panel from a half-resolution 240x240 framebuffer (frees SRAM for the
# Wi-Fi stack) with tear-free double-buffering for the screen redraws.
CONFIG_ST7701_PRESTO_HALF_RES=y
CONFIG_ST7701_PRESTO_DOUBLE_BUFFER=y

# 8 MB PSRAM (for the PSRAM screen).
CONFIG_PIMORONI_RP2350_PSRAM=y

# CYW43439 Wi-Fi driver.
CONFIG_WIFI_AIROC=y
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y

# The AIROC/WHD bring-up overflows the default 1 KB stacks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
