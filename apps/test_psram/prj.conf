# PSRAM bring-up test: detect the APS6404, walk the full 8 MB, and allocate
# from the PSRAM mem-attr heap.

CONFIG_PIMORONI_RP2350_PSRAM=y

# Allocate from the PSRAM memory-region via its memory-attr tag.
CONFIG_MEM_ATTR=y
CONFIG_MEM_ATTR_HEAP=y
CONFIG_MULTI_HEAP=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MAIN_STACK_SIZE=4096
