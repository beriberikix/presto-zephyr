# native_sim has no CYW43439 and no PSRAM: disable networking/Wi-Fi so the app
# still builds and exercises the drawing layer on the SDL display (the
# native_sim board provides sdl_dc as chosen zephyr,display). The framebuffer
# stays in SRAM (the PSRAM Kconfig dependency is unmet here).
CONFIG_DISPLAY=y
CONFIG_SDL_DISPLAY=y

CONFIG_NETWORKING=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_NET_MGMT=n
CONFIG_WIFI=n
CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_DNS_RESOLVER=n
