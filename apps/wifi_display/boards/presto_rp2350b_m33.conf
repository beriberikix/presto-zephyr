# Hardware-only options for the Presto board: drive the display from a
# half-resolution 240x240 framebuffer (115 KB, scanned out of SRAM) so the
# CYW43439 networking stack fits in the freed SRAM, and enable the driver.
CONFIG_ST7701_PRESTO_HALF_RES=y

CONFIG_WIFI_AIROC=y
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y
