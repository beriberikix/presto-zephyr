# Wi-Fi + display coexistence demo (portable bits).
#
# Hardware-only options (half-res framebuffer, AIROC driver) live in
# boards/presto_rp2350b_m33.conf; native_sim disables networking in
# boards/native_sim_native_64.conf and just exercises the display via SDL.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Display (resolved through chosen zephyr,display)
CONFIG_GPIO=y
CONFIG_DISPLAY=y

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y

# A static resolver guarantees name resolution even if the AP's DHCP offer
# carries no DNS option.
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

# Management events (connect result + IPv4 address add drive the state machine)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Buffers / heap sized for a small TLS-less HTTP fetch over the freed SRAM.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# The AIROC/WHD CYW43439 bring-up overflows the default 1 KB stacks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
