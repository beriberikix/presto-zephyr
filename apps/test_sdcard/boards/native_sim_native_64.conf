# No SD slot on native_sim: drop the whole storage stack. The app notices the
# disk is absent at runtime and logs that it skipped, rather than failing --
# this build exists to keep the devicetree and Kconfig honest, not to test a
# card.
CONFIG_SDHC=n
CONFIG_DISK_ACCESS=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
