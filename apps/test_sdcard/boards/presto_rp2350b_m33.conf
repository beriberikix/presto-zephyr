# Hardware-only options for the Presto board.

# The SD stack: an SPI-attached host controller, the card protocol layer on top
# of it, and the block device that FATFS mounts.
CONFIG_SPI=y
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# The card is read in 512-byte blocks and FATFS wants its own copy, so the
# default 1 KB main stack is not enough once a directory walk is in flight.
CONFIG_HEAP_MEM_POOL_SIZE=8192
