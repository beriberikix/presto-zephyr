# microSD bring-up test: initialise the card over SPI0, report its geometry,
# mount FAT, list the root directory and round-trip a file.
#
# Portable config shared by the Presto and native_sim builds; the per-board
# files under boards/ add the hardware specifics.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Long file names, in RAM rather than on the stack. Without this, FATFS
# truncates to 8.3 and a card written on a desktop machine lists as garbage --
# the failure looks like a corrupt card rather than a missing Kconfig.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=255
