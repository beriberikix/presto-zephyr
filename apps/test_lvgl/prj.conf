# LVGL widget proof-of-concept: label + button + slider driven by touch.
#
# Portable config shared by the Presto and native_sim builds; the per-board
# files under boards/ add the display/touch/memory specifics.

CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Disable the default theme's "grow + fade" press animation. It scales a
# pressed widget up over 80 ms (the button/slider "bounce"), which also forces
# a stream of per-frame redraws during a press - undesirable on this
# continuously-scanned panel. Widgets still show their pressed colour state.
CONFIG_LV_THEME_DEFAULT_GROW=n
CONFIG_LV_THEME_DEFAULT_TRANSITION_TIME=0

# Default LVGL object heap (native_sim); the Presto build overrides the size
# and places it in PSRAM instead.
CONFIG_LV_Z_MEM_POOL_SIZE=65536
