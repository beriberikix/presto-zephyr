# Hardware-only options for the Presto board.

# Half-resolution 240x240 framebuffer (115 KB SRAM), pixel-doubled to the
# panel. Deliberately NOT double-buffered: with double-buffering the driver
# renders display_write() into the back buffer and only presents it on an
# explicit st7701_presto_flip(), which LVGL's flush path never calls.
CONFIG_ST7701_PRESTO_HALF_RES=y

# 8 MB PSRAM, exposed as the "PSRAM" linker region.
CONFIG_PIMORONI_RP2350_PSRAM=y

# Place the LVGL object heap (widgets, styles, draw tasks) in PSRAM. The
# rendering buffer stays in SRAM (LV_Z_VDB_SIZE below): LVGL does heavy
# read-modify-write there and PSRAM sits behind the shared QMI bus.
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="PSRAM"
CONFIG_LV_Z_MEM_POOL_SIZE=262144

# Rendering buffer: 25% of 240x240x2 = ~29 KB of SRAM.
CONFIG_LV_Z_VDB_SIZE=25
