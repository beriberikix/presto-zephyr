# Hardware-only options for the Presto board.

# Half-resolution 240x240 framebuffer (115 KB SRAM), pixel-doubled to the panel.
# Single-buffered: LVGL's partial rendering writes only the small dirty regions
# straight into the live framebuffer. On this continuous-scanout DPI panel that
# is the clean path - the per-frame CPU/bus work stays tiny, so it never
# disturbs the timing-critical PIO/DMA scanout. (Double-buffering with a vblank
# flip was tried and glitched: rebuilding the back buffer every frame - by copy
# or full redraw - plus a per-frame flip congests the scanout pipeline.)
CONFIG_ST7701_PRESTO_HALF_RES=y

# 8 MB PSRAM, exposed as the "PSRAM" linker region. LVGL object heap + render
# buffer live here (dynamic alloc sizes the buffer from the real 240x240
# resolution), leaving SRAM for the framebuffer.
CONFIG_PIMORONI_RP2350_PSRAM=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="PSRAM"
CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
