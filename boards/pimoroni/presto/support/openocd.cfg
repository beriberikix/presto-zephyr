# Checking and set 'adapter speed'.
# Set the adapter speed, if unset, and given as an argument.
#
# The Raspberry Pi OpenOCD fork (shipped in the pico-sdk) does not set a
# default adapter speed via the interface config, so board.cmake passes
# `set_adapter_speed_if_not_set` as a --cmd-pre-init. This file defines that
# proc; the openocd runner loads it automatically as the board config, so it
# is available before board.cmake's pre-init commands run. Mirrors the
# upstream RP2350 boards (e.g. boards/weact/rp2350b_core/support/openocd.cfg).
proc set_adapter_speed_if_not_set { speed } {
	puts "checking adapter speed..."
	if { [catch {adapter speed} ret] } {
		adapter speed $speed
	}
}
